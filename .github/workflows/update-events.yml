name: Update Running Events

on:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install icalendar python-dateutil

      - name: Bake events into index.html
        run: python scripts/parse_ics.py

      - name: Commit index.html
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add index.html
          git diff --staged --quiet || (git commit -m "chore: update events [skip ci]" && git push)
