name: Update Running Events

on:
  schedule:
    - cron: '0 0-17,22,23 * * *'  # hourly, skip 1am–5am BKK (UTC 18–21)
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install icalendar python-dateutil recurring_ical_events

      - name: Bake events into index.html
        env:
          CALENDAR_ICS_URL: ${{ secrets.CALENDAR_ICS_URL }}
        run: python scripts/parse_ics.py

      - name: Build training.json (title + date/time only)
        env:
          WORKOUT_ICS_URL: ${{ secrets.WORKOUT_ICS_URL }}
        run: python scripts/build_training.py

      - name: Commit index.html and training.json
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add index.html training.json
          git diff --staged --quiet || (git commit -m "chore: update events [skip ci]" && git push)
