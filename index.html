<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Running Events</title>
<style>
:root{--bg:#0f1117;--s:#1a1d27;--b:#2a2d3a;--t:#e8eaf0;--m:#6b7280;--a:#f97316;--r:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}
header{background:var(--s);border-bottom:1px solid var(--b);padding:20px;text-align:center}
header h1{font-size:1.5rem;font-weight:700}
header p{color:var(--m);font-size:.82rem;margin-top:4px}

/* ── filters ── */
.filters{max-width:660px;margin:0 auto;padding:16px 14px 0;display:flex;flex-direction:column;gap:10px}
.search{width:100%;background:var(--s);border:1px solid var(--b);border-radius:var(--r);padding:9px 14px;color:var(--t);font-size:.88rem;outline:none}
.search::placeholder{color:var(--m)}
.search:focus{border-color:#4a4d5a}
.filter-row{display:flex;gap:6px;flex-wrap:wrap}
.filter-row label{font-size:.68rem;color:var(--m);margin-right:2px;align-self:center}
.pill{background:none;border:1px solid var(--b);color:var(--m);font-size:.72rem;font-weight:600;padding:4px 11px;border-radius:99px;cursor:pointer;transition:all .15s}
.pill:hover{border-color:#4a4d5a;color:var(--t)}
.pill.active{background:var(--a);border-color:var(--a);color:#fff}
.pill.p10.active{background:#22c55e;border-color:#22c55e;color:#fff}
.pill.p21.active{background:#f59e0b;border-color:#f59e0b;color:#fff}
.pill.p42.active{background:#ef4444;border-color:#ef4444;color:#fff}

/* ── events ── */
main{max-width:660px;margin:0 auto;padding:16px 14px 60px}
.sec{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--m);margin:24px 0 10px}
.sec:first-child{margin-top:0}
.card{background:var(--s);border:1px solid var(--b);border-radius:var(--r);padding:14px 16px;margin-bottom:8px;display:grid;grid-template-columns:52px 1fr auto;gap:0 12px;align-items:start}
.card.past{opacity:.5}
.day{font-size:1.4rem;font-weight:700;color:var(--a);line-height:1;text-align:center}
.card.past .day{color:var(--m)}
.mon{font-size:.65rem;text-transform:uppercase;letter-spacing:.06em;color:var(--m);text-align:center;margin-top:2px}
.title{font-size:.92rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;align-items:center}
.badge{font-size:.68rem;font-weight:700;padding:2px 7px;border-radius:99px}
.b10{background:#14532d22;color:#22c55e;border:1px solid #14532d66}
.b21{background:#78350f22;color:#f59e0b;border:1px solid #78350f66}
.b42{background:#7f1d1d22;color:#ef4444;border:1px solid #7f1d1d66}
.bun{background:#37415122;color:var(--m);border:1px solid #37415166}
.mi{font-size:.75rem;color:var(--m)}
.avs{display:flex;gap:3px;padding-top:2px}
.av{width:24px;height:24px;border-radius:50%;font-size:.62rem;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
.av-me{background:#1e40af;color:#93c5fd}
.av-oum{background:#6d28d9;color:#c4b5fd}
.empty{text-align:center;color:var(--m);font-size:.88rem;padding:32px 0}
.more-btn{background:none;border:1px solid var(--b);color:var(--m);font-size:.78rem;padding:8px 16px;border-radius:var(--r);cursor:pointer;margin-top:4px;width:100%}
.more-btn:hover{border-color:#4a4d5a}
footer{text-align:center;color:var(--m);font-size:.72rem;padding:20px}
</style>
</head>
<body>
<header>
  <div style="font-size:1.8rem;margin-bottom:4px">🏃</div>
  <h1>Running Events</h1>
  <p id="sub"></p>
</header>

<div class="filters">
  <input class="search" id="search" type="search" placeholder="Search events…" oninput="render()"/>
  <div class="filter-row">
    <span style="font-size:.68rem;color:var(--m)">Distance</span>
    <button class="pill active" data-dist="all"   onclick="setDist(this)">All</button>
    <button class="pill p10"   data-dist="10k"   onclick="setDist(this)">10k</button>
    <button class="pill p21"   data-dist="21.1k" onclick="setDist(this)">21.1k</button>
    <button class="pill p42"   data-dist="42k"   onclick="setDist(this)">42k</button>
  </div>
  <div class="filter-row">
    <span style="font-size:.68rem;color:var(--m)">With</span>
    <button class="pill active" data-who="all"  onclick="setWho(this)">Everyone</button>
    <button class="pill"        data-who="me"   onclick="setWho(this)">Me only</button>
    <button class="pill"        data-who="oum"  onclick="setWho(this)">Me + Oum</button>
  </div>
</div>

<main id="root"></main>
<footer id="ft"></footer>

<script>
// <!--DATA_START-->

ast":true},{"title":"ATM 21k","date":"2025-11-30","time":null,"location":"","distance":"21.1k","participants":["Me"],"isPast":true},{"title":"Bangsaen 21","date":"2025-12-21","time":null,"location":"","distance":null,"participants":["Me"],"isPast":true},{"title":"Pocari 21k","date":"2026-01-18","time":null,"location":"","distance":"21.1k","participants":["Me"],"isPast":true},{"title":"Cmu marathon - 42k","date":"2026-02-01","time":null,"location":"","distance":"42k","participants":["Me"],"isPast":true},{"title":"Osaka marathon","date":"2026-02-22","time":null,"location":"","distance":"42k","participants":["Me"],"isPast":true},{"title":"RUN FOR RELIFE 2026 - 11.5k","date":"2026-03-29","time":null,"location":"","distance":null,"participants":["Me"],"isPast":true},{"title":"Beijing half marathon","date":"2026-04-12","time":null,"location":"","distance":"42k","participants":["Me"],"isPast":true},{"title":"Sketcher - 10k","date":"2026-05-31","time":null,"location":"Chulalongkorn University 254 Phaya Thai Rd., Pathum Wan, Pathum Wan, Bangkok 10330, Thailand","distance":"10k","participants":["Me"],"isPast":true},{"title":"Sattahip 10k","date":"2026-06-13","time":null,"location":"Sattahip District, Chon Buri, Thailand","distance":"10k","participants":["Me"],"isPast":true},{"title":"Nonthaburi night run - 10k","date":"2026-06-20","time":null,"location":"","distance":"10k","participants":["Me"],"isPast":true},{"title":"Yothin run - 10k","date":"2026-06-28","time":null,"location":"","distance":"10k","participants":["Me"],"isPast":true},{"title":"Run for the wild - 15k","date":"2026-07-05","time":null,"location":"Wangree Resort 143/1 Yothathikan Nakhon Nayok 2005 Road, Khao Phra, Mueang Nakhon Nayok District, Nakhon Nayok 26000, Thailand","distance":null,"participants":["Me"],"isPast":true},{"title":"GPO Run for 60th Anniversary (21K)","date":"2026-07-12","time":"03:30","location":"Government Pharmaceutical Organisation (GPO), Bangkok","distance":"42k","participants":["Me"],"isPast":true},{"title":"RUN MUN KAN Season 3: 10K Run","date":"2026-07-31","time":"18:00","location":"Thai Paper Mill, Mueang, Kanchanaburi, Thailand","distance":"42k","participants":["Me"],"isPast":true},{"title":"TGS Charity Run 2026 - 10k","date":"2026-08-09","time":null,"location":"Nonthaburi Pier Suan Yai, Mueang Nonthaburi","distance":"10k","participants":["Me"],"isPast":true},{"title":"12 Aug - 21k","date":"2026-08-12","time":null,"location":"Queen Sirikit National Convention Centre, Khlong Toei, Bangkok 10110, Thailand","distance":"21.1k","participants":["Me"],"isPast":true},{"title":"Red Cross Pakkret City Run 2026 X Muang Thong Thani - 10km","date":"2026-08-30","time":"03:30","location":"Outlet Square Muang Thong Thani, Pak Kret, Nonthaburi 11120, Thailand","distance":"42k","participants":["Me"],"isPast":false},{"title":"Padriew 21k","date":"2026-09-06","time":null,"location":"Chachoengsao, Thailand","distance":"21.1k","participants":["Me","Oum"],"isPast":false},{"title":"รัญจวน 1st RUN 10K","date":"2026-09-19","time":null,"location":"","distance":"10k","participants":["Me","Oum"],"isPast":false},{"title":"Sanrio Characters Half Marathon","date":"2026-09-27","time":"15:00","location":"","distance":"42k","participants":["Me"],"isPast":false},{"title":"PEA Mini Marathon 2026 - 10k","date":"2026-10-04","time":null,"location":"","distance":"42k","participants":["Me"],"isPast":false},{"title":"Tokyo Legacy Half Marathon - 21km","date":"2026-10-18","time":null,"location":"Tokyo, Japan","distance":"42k","participants":["Me"],"isPast":false},{"title":"Chengdu Marathon 2026 (Half Marathon - 21K)","date":"2026-10-25","time":null,"location":"Chengdu, China","distance":"42k","participants":["Me","Oum"],"isPast":false},{"title":"SAUCONY BKK10K","date":"2026-10-25","time":"05:00","location":"","distance":"10k","participants":["Me"],"isPast":false},{"title":"Walk run bike - 11k","date":"2026-11-01","time":null,"location":"Nonthaburi, Mueang Nonthaburi District, Nonthaburi, Thailand","distance":null,"participants":["Me"],"isPast":false},{"title":"CMU 10k","date":"2026-11-08","time":"05:30","location":"Chiang Mai University","distance":"42k","participants":["Me","Oum"],"isPast":false},{"title":"Bangsaen 42k","date":"2026-11-15","time":null,"location":"Bangsaen Beach, Chon Buri, Thailand","distance":"42k","participants":["Me"],"isPast":false},{"title":"ATM 21k","date":"2026-11-28","time":"00:00","location":"Bangkok","distance":"21.1k","participants":["Me","Oum"],"isPast":false},{"title":"ATM 4.5k","date":"2026-11-29","time":null,"location":"Bangkok","distance":null,"participants":["Me"],"isPast":false},{"title":"Shanghai Marathon 2026","date":"2026-12-06","time":"07:00","location":"","distance":"42k","participants":["Me"],"isPast":false},{"title":"Bangsaen 21k","date":"2026-12-20","time":null,"location":"Bangsaen Beach, Chon Buri, Thailand","distance":"21.1k","participants":["Me"],"isPast":false}]};
// <!--DATA_END-->

const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
let activeDist='all', activeWho='all';

function setDist(btn){
  document.querySelectorAll('[data-dist]').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  activeDist=btn.dataset.dist;
  render();
}
function setWho(btn){
  document.querySelectorAll('[data-who]').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  activeWho=btn.dataset.who;
  render();
}

function badge(d){
  if(!d)return'<span class="badge bun">?</span>';
  const c=d==='10k'?'b10':d==='21.1k'?'b21':'b42';
  return`<span class="badge ${c}">${d}</span>`;
}
function avs(ps){
  return ps.map(p=>{
    const c=p==='Oum'?'av-oum':'av-me';
    return`<div class="av ${c}" title="${p}">${p==='Oum'?'OUM':'ME'}</div>`;
  }).join('');
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function card(ev){
  const d=new Date(ev.date+'T00:00:00');
  const loc=ev.location?`<span class="mi">📍 ${esc(ev.location)}</span>`:'';
  const time=ev.time&&ev.time!=='00:00'?`<span class="mi">🕐 ${ev.time}</span>`:'';
  return`<div class="card${ev.isPast?' past':''}">
    <div><div class="day">${d.getDate()}</div><div class="mon">${MON[d.getMonth()]} ${d.getFullYear()}</div></div>
    <div><div class="title">${esc(ev.title)}</div><div class="meta">${badge(ev.distance)}${time}${loc}</div></div>
    <div class="avs">${avs(ev.participants)}</div>
  </div>`;
}

function rel(iso){
  const m=Math.round((Date.now()-new Date(iso))/60000);
  if(m<2)return'just now';if(m<60)return m+'m ago';
  const h=Math.round(m/60);if(h<24)return h+'h ago';
  return Math.round(h/24)+'d ago';
}

function filterEvents(events){
  const q=(document.getElementById('search').value||'').toLowerCase().trim();
  return events.filter(ev=>{
    // distance filter
    if(activeDist!=='all'){
      if(ev.distance!==activeDist)return false;
    }
    // participant filter
    if(activeWho==='me' && ev.participants.includes('Oum'))return false;
    if(activeWho==='oum' && !ev.participants.includes('Oum'))return false;
    // search
    if(q){
      const hay=(ev.title+' '+ev.location).toLowerCase();
      if(!hay.includes(q))return false;
    }
    return true;
  });
}

function section(title, events, collapsePast){
  if(!events.length) return`<p class="sec">${title}</p><div class="empty">No events</div>`;
  let h=`<p class="sec">${title} — ${events.length}</p>`;
  if(!collapsePast){
    h+=events.map(card).join('');
  } else {
    const vis=events.slice(0,5), hid=events.slice(5);
    h+=vis.map(card).join('');
    if(hid.length){
      const id='more-'+Math.random().toString(36).slice(2);
      const bid='btn-'+id;
      h+=`<div id="${id}" style="display:none">${hid.map(card).join('')}</div>
          <button class="more-btn" id="${bid}" onclick="
            var m=document.getElementById('${id}');
            var show=m.style.display==='none';
            m.style.display=show?'block':'none';
            this.textContent=show?'Hide older events':'Show ${hid.length} more past events';
          ">Show ${hid.length} more past events</button>`;
    }
  }
  return h;
}

function render(){
  const {updated,events}=EVENTS_DATA;
  const filtered=filterEvents(events);
  const up=filtered.filter(e=>!e.isPast);
  const past=filtered.filter(e=>e.isPast).reverse();

  document.getElementById('sub').textContent=
    `${up.length} upcoming · ${past.length} past`;

  let h=section('Upcoming', up, false);
  h+=`<div style="margin-top:28px"></div>`;
  h+=section('Past', past, true);
  document.getElementById('root').innerHTML=h;
  document.getElementById('ft').textContent=`Updated ${rel(updated)} · refreshes every 30 min`;
}

render();
</script>
</body>
</html>
