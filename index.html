<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#0a0c11"/>
<title>Running Events</title>
<style>
:root{
  --bg:#0a0c11;
  --bg-elev:#10131a;
  --s:#151922;
  --s-hover:#1a1f2b;
  --b:#262b3a;
  --b-soft:#32384a;
  --t:#eef1f7;
  --m:#8b93a7;
  --m2:#6b7388;
  --a:#ff8a3d;
  --a-dim:rgba(255,138,61,.14);
  --r:14px;
  --shadow:0 8px 28px rgba(0,0,0,.38);
  --shadow-sm:0 2px 10px rgba(0,0,0,.25);
  --max:680px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:
    radial-gradient(1200px 500px at 50% -120px,rgba(255,138,61,.09),transparent 60%),
    radial-gradient(800px 400px at 100% 20%,rgba(99,102,241,.06),transparent 50%),
    var(--bg);
  color:var(--t);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Sarabun','Noto Sans Thai',Tahoma,sans-serif;
  min-height:100vh;
  line-height:1.45;
}
header{
  text-align:center;
  padding:28px 18px 18px;
  max-width:var(--max);
  margin:0 auto;
}
.logo{
  width:52px;height:52px;margin:0 auto 12px;
  border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  font-size:1.55rem;
  background:linear-gradient(145deg,var(--a-dim),rgba(99,102,241,.12));
  border:1px solid rgba(255,138,61,.22);
  box-shadow:var(--shadow-sm);
}
header h1{
  font-size:1.55rem;font-weight:750;letter-spacing:-.02em;
  background:linear-gradient(180deg,#fff 30%,#c5cad8);
  -webkit-background-clip:text;background-clip:text;
  color:transparent;
}
header p{color:var(--m);font-size:.8rem;margin-top:6px;font-weight:500}
.filters{
  position:sticky;top:0;z-index:30;
  backdrop-filter:blur(16px) saturate(1.2);
  -webkit-backdrop-filter:blur(16px) saturate(1.2);
  background:rgba(10,12,17,.82);
  border-bottom:1px solid var(--b);
  padding:12px 14px 14px;
}
.filters-inner{
  max-width:var(--max);margin:0 auto;
  display:flex;flex-direction:column;gap:10px;
}
.search{
  width:100%;
  background:var(--s);
  border:1px solid var(--b);
  border-radius:999px;
  padding:11px 16px;
  color:var(--t);
  font-size:.9rem;
  outline:none;
  transition:border-color .15s,box-shadow .15s,background .15s;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
}
.search::placeholder{color:var(--m2)}
.search:focus{
  border-color:rgba(255,138,61,.55);
  box-shadow:0 0 0 3px var(--a-dim);
  background:var(--s-hover);
}
.filter-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.filter-label{
  font-size:.65rem;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--m2);min-width:4.2rem;
}
.pill{
  background:var(--s);
  border:1px solid var(--b);
  color:var(--m);
  font-size:.74rem;font-weight:650;
  padding:6px 12px;border-radius:99px;
  cursor:pointer;
  transition:background .15s,border-color .15s,color .15s,transform .12s,box-shadow .15s;
}
.pill:hover{border-color:var(--b-soft);color:var(--t);background:var(--s-hover)}
.pill:active{transform:scale(.97)}
.pill.active{
  background:linear-gradient(135deg,#ff9a4d,var(--a));
  border-color:transparent;color:#1a0f08;
  box-shadow:0 2px 12px rgba(255,138,61,.35);
}
.pill.p5.active{background:linear-gradient(135deg,#22d3ee,#06b6d4);box-shadow:0 2px 12px rgba(6,182,212,.3);color:#042f2e}
.pill.p10.active{background:linear-gradient(135deg,#4ade80,#22c55e);box-shadow:0 2px 12px rgba(34,197,94,.3);color:#052e16}
.pill.p21.active{background:linear-gradient(135deg,#fbbf24,#f59e0b);box-shadow:0 2px 12px rgba(245,158,11,.3);color:#451a03}
.pill.p42.active{background:linear-gradient(135deg,#f87171,#ef4444);box-shadow:0 2px 12px rgba(239,68,68,.3);color:#450a0a}
main{max-width:var(--max);margin:0 auto;padding:18px 14px 72px}
.sec{
  display:flex;align-items:center;gap:12px;
  font-size:.7rem;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--m);
  margin:28px 0 12px;
}
.sec:first-child{margin-top:4px}
.sec::after{
  content:'';flex:1;height:1px;
  background:linear-gradient(90deg,var(--b),transparent);
}
.card{
  background:linear-gradient(180deg,var(--s-hover) 0%,var(--s) 100%);
  border:1px solid var(--b);
  border-radius:var(--r);
  padding:14px 14px 14px 12px;
  margin-bottom:10px;
  display:grid;
  grid-template-columns:58px minmax(0,1fr) auto;
  gap:0 12px;
  align-items:start;
  box-shadow:var(--shadow-sm);
  transition:transform .15s ease,border-color .15s,box-shadow .15s,background .15s;
}
.card:hover{
  border-color:var(--b-soft);
  box-shadow:var(--shadow);
  transform:translateY(-1px);
}
.card.past{opacity:.58}
.card.past:hover{transform:none;box-shadow:var(--shadow-sm);opacity:.7}
.date{
  text-align:center;
  background:var(--a-dim);
  border:1px solid rgba(255,138,61,.18);
  border-radius:12px;
  padding:8px 4px 7px;
  min-height:52px;
}
.card.past .date{
  background:rgba(139,147,167,.08);
  border-color:rgba(139,147,167,.15);
}
.day{font-size:1.35rem;font-weight:800;color:var(--a);line-height:1;letter-spacing:-.03em}
.card.past .day{color:var(--m)}
.mon{font-size:.62rem;text-transform:uppercase;letter-spacing:.05em;color:var(--m);margin-top:3px;font-weight:600;line-height:1.2}
.body{min-width:0;padding-top:1px}
.title{
  font-size:.95rem;font-weight:650;line-height:1.4;
  overflow-wrap:anywhere;word-break:break-word;
  letter-spacing:-.01em;
}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.badge{
  font-size:.68rem;font-weight:750;padding:3px 8px;border-radius:99px;
  letter-spacing:.02em;
}
.b5{background:rgba(6,182,212,.12);color:#67e8f9;border:1px solid rgba(6,182,212,.28)}
.b10{background:rgba(34,197,94,.12);color:#86efac;border:1px solid rgba(34,197,94,.28)}
.b21{background:rgba(245,158,11,.12);color:#fcd34d;border:1px solid rgba(245,158,11,.28)}
.b42{background:rgba(239,68,68,.12);color:#fca5a5;border:1px solid rgba(239,68,68,.28)}
.bun{background:rgba(107,114,136,.12);color:var(--m);border:1px solid rgba(107,114,136,.28)}
.mi{
  font-size:.75rem;color:var(--m);
  display:inline-flex;align-items:center;gap:3px;
  max-width:100%;
}
a.maps{
  color:var(--m);text-decoration:none;overflow-wrap:anywhere;
  border-radius:6px;padding:1px 2px;margin:-1px -2px;
  transition:color .15s,background .15s;
}
a.maps:hover{color:var(--a);background:var(--a-dim);text-decoration:none}
.avs{display:flex;flex-direction:column;gap:4px;padding-top:2px;align-items:flex-end}
.av{
  min-width:30px;height:26px;padding:0 7px;border-radius:99px;
  font-size:.6rem;font-weight:750;
  display:flex;align-items:center;justify-content:center;
  border:1px solid transparent;white-space:nowrap;
  box-shadow:0 1px 4px rgba(0,0,0,.25);
}
.av-me{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#dbeafe;border-color:rgba(147,197,253,.25)}
.av-oum{background:linear-gradient(135deg,#7c3aed,#6d28d9);color:#ede9fe;border-color:rgba(196,181,253,.25)}
.empty{
  text-align:center;color:var(--m);
  padding:40px 16px;border:1px dashed var(--b);border-radius:var(--r);
  background:rgba(21,25,34,.5);
}
.empty-ico{font-size:1.8rem;margin-bottom:8px;opacity:.85}
.empty p{font-size:.9rem;font-weight:600;color:var(--t)}
.empty-hint{font-size:.78rem;color:var(--m2);margin-top:4px;font-weight:500}
.more-btn{
  background:var(--s);border:1px solid var(--b);color:var(--m);
  font-size:.8rem;font-weight:600;padding:11px 16px;border-radius:var(--r);
  cursor:pointer;margin-top:4px;width:100%;
  transition:border-color .15s,color .15s,background .15s;
}
.more-btn:hover{border-color:var(--b-soft);color:var(--t);background:var(--s-hover)}
footer{
  text-align:center;color:var(--m2);font-size:.72rem;
  padding:8px 16px 36px;letter-spacing:.02em;
}
@media (min-width:480px){
  .card{padding:16px;gap:0 14px;grid-template-columns:64px minmax(0,1fr) auto}
  .date{padding:10px 6px}
  .avs{flex-direction:row;gap:5px}
}
@media (prefers-reduced-motion:reduce){
  .card,.pill,.search,a.maps,.more-btn{transition:none}
  .card:hover{transform:none}
}
</style>
</head>

const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
let activeDist='all';
let whoTeuy=false, whoOum=false;
function setDist(btn){
  document.querySelectorAll('[data-dist]').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  activeDist=btn.dataset.dist;
  render();
}
function toggleWho(btn){
  btn.classList.toggle('active');
  whoTeuy=!!document.querySelector('[data-who="teuy"].active');
  whoOum=!!document.querySelector('[data-who="oum"].active');
  render();
}
function badge(d){
  if(!d)return'<span class="badge bun">?</span>';
  const c=d==='5k'?'b5':d==='10k'?'b10':d==='21.1k'?'b21':'b42';
  return`<span class="badge ${c}">${d}</span>`;
}
function avs(ps){
  return ps.map(p=>{
    const c=p==='Oum'?'av-oum':'av-me';
    const label=p==='Oum'?'อุ้ม':'เต้ย';
    return`<div class="av ${c}" title="${label}">${label}</div>`;
  }).join('');
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function stripLocParens(s){
  let changed=true;
  while(changed){
    changed=false;
    s=s.replace(/\(([^()]*)\)/g,(full,inner)=>{
      const t=inner.trim();
      const outside=s.replace(full,'');
      const isAddr=/^\d/.test(t)||/\b(rd|road|soi|street|ave|lane|ถนน)\b/i.test(t);
      const head=t.toLowerCase().slice(0,Math.min(12,t.length));
      const isDup=t.length>8&&head&&outside.toLowerCase().includes(head);
      const isLong=t.length>20;
      if(isAddr||isDup||isLong){changed=true;return '';}
      if(t.length<=10) return full;
      changed=true;return '';
    });
    s=s.replace(/\s{2,}/g,' ').replace(/\s+,/g,',').replace(/,\s*$/,'').trim();
  }
  return s;
}
function shortLoc(full){
  if(!full) return '';
  let s=stripLocParens(String(full).trim());
  if(s.length<=40) return s;
  const parts=s.split(',').map(p=>p.trim()).filter(Boolean);
  const first=parts[0]||s;
  const vm=first.match(/^(.{3,40}?)\s+\d{1,5}(?:\/\d+)?\b/);
  if(vm) return vm[1];
  const ac=first.match(/\(([A-Za-z0-9]{2,8})\)\s*$/);
  if(ac&&first.length>20){
    let city='';
    if(parts.length>=3) city=parts[parts.length-2].replace(/\s+\d{4,5}$/,'').trim();
    else if(parts.length===2) city=parts[1].replace(/\s+\d{4,5}$/,'').trim();
    return city?ac[1]+', '+city:ac[1];
  }
  if(first.length<=44&&parts.length>=2) return first;
  if(parts.length>=2){
    let city=parts[parts.length-2].replace(/\s+\d{4,5}$/,'').trim();
    let country=parts[parts.length-1].replace(/\s+\d{4,5}$/,'').trim();
    if(/\b(district|mueang|amphoe)\b/i.test(city)&&parts.length>=3)
      city=parts[parts.length-3].replace(/\s+\d{4,5}$/,'').trim();
    if(city.toLowerCase()===country.toLowerCase()) return city;
    return city+', '+country;
  }
  return s.length>40?s.slice(0,37)+'…':s;
}
function mapsHref(loc){
  return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(loc);
}
function card(ev){
  const d=new Date(ev.date+'T00:00:00');
  const loc=ev.location?`<a class="mi maps" href="${mapsHref(ev.location).replace(/&/g,'&amp;')}" target="_blank" rel="noopener noreferrer" title="${esc(ev.location)}">📍 ${esc(shortLoc(ev.location))}</a>`:'';
  const time=ev.time&&ev.time!=='00:00'?`<span class="mi">🕐 ${ev.time}</span>`:'';
  return`<div class="card${ev.isPast?' past':''}">
    <div class="date"><div class="day">${d.getDate()}</div><div class="mon">${MON[d.getMonth()]} ${d.getFullYear()}</div></div>
    <div class="body"><div class="title">${esc(ev.title)}</div><div class="meta">${badge(ev.distance)}${time}${loc}</div></div>
    <div class="avs">${avs(ev.participants)}</div>
  </div>`;
}
function rel(iso){
  const m=Math.round((Date.now()-new Date(iso))/60000);
  if(m<2)return'just now';if(m<60)return m+'m ago';
  const h=Math.round(m/60);if(h<24)return h+'h ago';
  return Math.round(h/24)+'d ago';
}
function filterEvents(events){
  const q=(document.getElementById('search').value||'').toLowerCase().trim();
  return events.filter(ev=>{
    if(activeDist!=='all' && ev.distance!==activeDist) return false;
    const hasMe=ev.participants.includes('Me');
    const hasOum=ev.participants.includes('Oum');
    if(whoTeuy && whoOum){
      if(!(hasMe && hasOum)) return false;
    } else if(whoTeuy){
      if(!hasMe) return false;
    } else if(whoOum){
      if(!hasOum) return false;
    }
    if(q){
      const hay=(ev.title+' '+ev.location).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}
function section(title, events, collapsePast){
  if(!events.length) return`<p class="sec">${title}</p><div class="empty"><div class="empty-ico">🏃</div><p>No events</p><p class="empty-hint">ลองเปลี่ยนตัวกรองหรือคำค้นหา</p></div>`;
  let h=`<p class="sec">${title} — ${events.length}</p>`;
  if(!collapsePast){ h+=events.map(card).join(''); }
  else {
    const vis=events.slice(0,5), hid=events.slice(5);
    h+=vis.map(card).join('');
    if(hid.length){
      const id='more-'+Math.random().toString(36).slice(2);
      h+=`<div id="${id}" style="display:none">${hid.map(card).join('')}</div>
          <button class="more-btn" onclick="var m=document.getElementById('${id}');var show=m.style.display==='none';m.style.display=show?'block':'none';this.textContent=show?'Hide older events':'Show ${hid.length} more past events';">Show ${hid.length} more past events</button>`;
    }
  }
  return h;
}
function render(){
  const {updated,events}=EVENTS_DATA;
  const filtered=filterEvents(events);
  const up=filtered.filter(e=>!e.isPast);
  const past=filtered.filter(e=>e.isPast).reverse();
  document.getElementById('root').innerHTML=section('Upcoming', up, false)+section('Past', past, true);
  document.getElementById('sub').textContent=`${events.length} events · updated ${rel(updated)}`;
  document.getElementById('ft').textContent='Synced from Google Calendar';
}
render();
</script>
</body>
