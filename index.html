<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#F2F0E9"/>
<title>Running Events</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#F2F0E9;
  --bg-soft:#EBE8DF;
  --ink:#111111;
  --ink-soft:#3a3a3a;
  --muted:#6a6a6a;
  --rule:#1a1a1a;
  --rule-soft:#c8c4b8;
  --orange:#E65A28;
  --orange-dim:rgba(230,90,40,.12);
  --stamp:#111;
  --max:680px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:
    radial-gradient(ellipse at 20% 0%,rgba(0,0,0,.03),transparent 50%),
    repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.012) 3px,rgba(0,0,0,.012) 4px),
    var(--bg);
  color:var(--ink);
  font-family:'Source Sans 3',-apple-system,BlinkMacSystemFont,'Segoe UI','Sarabun','Noto Sans Thai',Tahoma,sans-serif;
  min-height:100vh;
  line-height:1.45;
}
header{
  max-width:var(--max);
  margin:0 auto;
  padding:22px 16px 14px;
  border-bottom:2px solid var(--rule);
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:12px;
}
.masthead{
  display:flex;
  flex-direction:column;
  gap:2px;
  min-width:0;
}
.kicker{
  font-family:'Oswald',sans-serif;
  font-size:.62rem;
  font-weight:600;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--muted);
}
header h1{
  font-family:'Oswald',sans-serif;
  font-size:clamp(1.7rem,6vw,2.35rem);
  font-weight:700;
  letter-spacing:.02em;
  text-transform:uppercase;
  line-height:.95;
  color:var(--ink);
}
header p{
  font-size:.78rem;
  color:var(--muted);
  font-weight:600;
  margin-top:6px;
}
.stamp-logo{
  flex-shrink:0;
  width:64px;height:64px;
  border:2.5px solid var(--ink);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;
  text-align:center;
  transform:rotate(-8deg);
  background:var(--bg);
  box-shadow:2px 2px 0 rgba(0,0,0,.08);
}
.stamp-logo .star{font-size:.7rem;line-height:1;color:var(--orange)}
.stamp-logo span{
  font-family:'Oswald',sans-serif;
  font-size:.48rem;
  font-weight:700;
  letter-spacing:.06em;
  text-transform:uppercase;
  line-height:1.15;
  padding:0 6px;
}
.filters{
  position:sticky;top:0;z-index:30;
  background:rgba(242,240,233,.94);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--rule);
  padding:12px 14px 14px;
}
.filters-inner{
  max-width:var(--max);margin:0 auto;
  display:flex;flex-direction:column;gap:10px;
}
.search{
  width:100%;
  background:var(--bg);
  border:1.5px solid var(--ink);
  border-radius:0;
  padding:10px 12px;
  color:var(--ink);
  font-size:.9rem;
  font-family:inherit;
  outline:none;
  transition:box-shadow .15s,background .15s;
}
.search::placeholder{color:var(--muted)}
.search:focus{
  background:#fff;
  box-shadow:3px 3px 0 var(--orange);
}
.filter-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.filter-label{
  font-family:'Oswald',sans-serif;
  font-size:.65rem;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);min-width:4.4rem;
}
.pill{
  background:transparent;
  border:1.5px solid var(--ink);
  color:var(--ink);
  font-family:'Oswald',sans-serif;
  font-size:.72rem;font-weight:600;
  letter-spacing:.04em;
  text-transform:uppercase;
  padding:5px 11px;
  border-radius:0;
  cursor:pointer;
  transition:background .12s,color .12s,box-shadow .12s,transform .1s;
}
.pill:hover{background:var(--bg-soft)}
.pill:active{transform:translate(1px,1px)}
.pill.active{
  background:var(--ink);
  color:var(--bg);
  box-shadow:none;
}
.pill[data-who].active{
  background:var(--orange);
  border-color:var(--orange);
  color:#fff;
}
main{max-width:var(--max);margin:0 auto;padding:8px 0 64px}
.sec{
  display:flex;align-items:baseline;gap:10px;
  font-family:'Oswald',sans-serif;
  font-size:.78rem;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink);
  margin:22px 14px 0;
  padding-bottom:8px;
  border-bottom:2px solid var(--rule);
}
.sec:first-child{margin-top:14px}
.sec .count{
  font-size:.68rem;font-weight:600;letter-spacing:.08em;
  color:var(--muted);margin-left:auto;
}
.card{
  display:grid;
  grid-template-columns:minmax(0,1fr) 64px 58px;
  gap:0 10px;
  align-items:center;
  padding:14px 14px;
  border-bottom:1px solid var(--rule);
  background:transparent;
  transition:background .12s;
}
.card:hover{background:rgba(0,0,0,.025)}
.card.past{opacity:.55}
.card.past:hover{opacity:.72}
.body{min-width:0}
.title{
  font-family:'Oswald',sans-serif;
  font-size:1.02rem;font-weight:700;
  letter-spacing:.01em;
  text-transform:uppercase;
  line-height:1.2;
  overflow-wrap:anywhere;word-break:break-word;
  color:var(--ink);
}
.meta{
  display:flex;flex-wrap:wrap;gap:6px 10px;
  margin-top:6px;align-items:center;
}
.mi{
  font-size:.72rem;color:var(--muted);
  display:inline-flex;align-items:center;gap:3px;
  font-weight:600;letter-spacing:.02em;
  text-transform:uppercase;
  max-width:100%;
}
a.maps{
  color:var(--muted);text-decoration:none;overflow-wrap:anywhere;
  border-bottom:1px solid transparent;
  transition:color .12s,border-color .12s;
}
a.maps:hover{color:var(--orange);border-bottom-color:var(--orange)}
.date{
  text-align:center;
  padding:2px 0;
  border-left:1px solid var(--rule-soft);
  border-right:1px solid var(--rule-soft);
}
.dow{
  font-family:'Oswald',sans-serif;
  font-size:.58rem;font-weight:600;
  letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);line-height:1;
}
.day{
  font-family:'Oswald',sans-serif;
  font-size:1.85rem;font-weight:700;
  color:var(--orange);line-height:.95;
  letter-spacing:-.02em;
  margin:2px 0 1px;
}
.card.past .day{color:var(--muted)}
.mon{
  font-family:'Oswald',sans-serif;
  font-size:.58rem;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-soft);line-height:1.15;
}
.side{
  display:flex;flex-direction:column;
  align-items:center;gap:6px;
}
.badge{
  width:52px;height:52px;
  border-radius:50%;
  border:2.5px solid var(--stamp);
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;
  text-align:center;
  background:var(--bg);
  position:relative;
  box-shadow:inset 0 0 0 1.5px var(--stamp);
  font-family:'Oswald',sans-serif;
  line-height:1.05;
  transform:rotate(-6deg);
}
.badge::before{
  content:'★';
  position:absolute;top:4px;left:50%;
  transform:translateX(-50%);
  font-size:.45rem;color:var(--ink);
  opacity:.7;
}
.badge .b-top{
  font-size:.42rem;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;margin-top:6px;color:var(--muted);
}
.badge .b-main{
  font-size:.78rem;font-weight:700;letter-spacing:.02em;
  text-transform:uppercase;color:var(--ink);
}
.badge.b5{border-color:#0e7490;box-shadow:inset 0 0 0 1.5px #0e7490}
.badge.b5 .b-main{color:#0e7490}
.badge.b10{border-color:#15803d;box-shadow:inset 0 0 0 1.5px #15803d}
.badge.b10 .b-main{color:#15803d}
.badge.b21{border-color:#b45309;box-shadow:inset 0 0 0 1.5px #b45309}
.badge.b21 .b-main{color:#b45309}
.badge.b42{border-color:#b91c1c;box-shadow:inset 0 0 0 1.5px #b91c1c}
.badge.b42 .b-main{color:#b91c1c}
.badge.bun{border-style:dashed;opacity:.85}
.avs{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.av{
  font-family:'Oswald',sans-serif;
  font-size:.5rem;font-weight:700;
  letter-spacing:.04em;text-transform:uppercase;
  padding:2px 5px;
  border:1.5px solid var(--ink);
  background:var(--bg);
  color:var(--ink);
  white-space:nowrap;
  line-height:1.2;
}
.av-oum{background:var(--ink);color:var(--bg)}
.empty{
  text-align:center;color:var(--muted);
  padding:36px 16px;margin:12px 14px;
  border:1.5px dashed var(--rule);
}
.empty-ico{font-size:1.6rem;margin-bottom:6px}
.empty p{font-family:'Oswald',sans-serif;font-size:.95rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.empty-hint{font-size:.78rem;margin-top:4px;font-weight:600}
.more-btn{
  display:block;width:calc(100% - 28px);margin:12px 14px 0;
  background:transparent;border:1.5px solid var(--ink);color:var(--ink);
  font-family:'Oswald',sans-serif;
  font-size:.78rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  padding:11px 16px;cursor:pointer;
  transition:background .12s,color .12s,box-shadow .12s;
}
.more-btn:hover{background:var(--ink);color:var(--bg)}

/* ── next race hero ── */
.hero{
  margin:14px 14px 4px;
  border:2px solid var(--rule);
  background:var(--bg);
  box-shadow:4px 4px 0 rgba(0,0,0,.08);
  position:relative;
  overflow:hidden;
}
.hero::before{
  content:'';
  position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.015) 3px,rgba(0,0,0,.015) 4px);
  pointer-events:none;
}
.hero-inner{
  position:relative;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:12px 14px;
  padding:16px 14px 14px;
  align-items:start;
}
.hero-kicker{
  font-family:'Oswald',sans-serif;
  font-size:.62rem;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase;
  color:var(--muted);
  margin-bottom:4px;
}
.hero-count{
  font-family:'Oswald',sans-serif;
  font-weight:700;
  letter-spacing:.01em;
  line-height:.95;
  color:var(--orange);
  text-transform:uppercase;
  font-size:clamp(1.85rem,8vw,2.6rem);
  margin-bottom:8px;
}
.hero-count.today{color:var(--ink)}
.hero-title{
  font-family:'Oswald',sans-serif;
  font-size:clamp(1.05rem,4.2vw,1.35rem);
  font-weight:700;
  letter-spacing:.01em;
  text-transform:uppercase;
  line-height:1.15;
  overflow-wrap:anywhere;word-break:break-word;
  color:var(--ink);
}
.hero-meta{
  display:flex;flex-wrap:wrap;gap:6px 12px;
  margin-top:10px;align-items:center;
}
.hero-meta .mi{font-size:.78rem}
.hero-right{
  display:flex;flex-direction:column;
  align-items:center;gap:8px;
  padding-left:10px;
  border-left:1px solid var(--rule-soft);
}
.hero .badge{
  width:68px;height:68px;
  transform:rotate(-8deg);
}
.hero .badge .b-top{font-size:.48rem;margin-top:8px}
.hero .badge .b-main{font-size:.95rem}
.hero .badge::before{font-size:.55rem;top:5px}
.hero .avs{gap:4px}
.hero .av{font-size:.58rem;padding:3px 7px}
.hero-date{
  text-align:center;
  font-family:'Oswald',sans-serif;
}
.hero-date .dow{
  font-size:.62rem;letter-spacing:.14em;color:var(--muted);
}
.hero-date .day{
  font-size:2rem;color:var(--orange);margin:1px 0;
}
.hero-date .mon{
  font-size:.62rem;letter-spacing:.1em;color:var(--ink-soft);
}
.hero-fallback{
  font-size:.65rem;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);
  margin-top:8px;
}
.sec.after-hero{margin-top:18px}
@media (min-width:480px){
  .hero-inner{padding:18px 18px 16px;gap:14px 18px}
  .hero .badge{width:76px;height:76px}
  .hero .badge .b-main{font-size:1.05rem}
  .hero-date .day{font-size:2.25rem}
}
footer{
  text-align:center;color:var(--muted);font-size:.7rem;
  padding:10px 16px 36px;letter-spacing:.06em;
  text-transform:uppercase;font-weight:600;
  border-top:1px solid var(--rule-soft);
  max-width:var(--max);margin:0 auto;
}
@media (min-width:480px){
  .card{grid-template-columns:minmax(0,1fr) 76px 68px;gap:0 14px;padding:16px 18px}
  .day{font-size:2.1rem}
  .badge{width:58px;height:58px}
  .badge .b-main{font-size:.88rem}
  header{padding:28px 18px 16px}
}
@media (prefers-reduced-motion:reduce){
  .pill,.search,a.maps,.more-btn,.card{transition:none}
}
</style>
</head>

  </div>
</div>
<main id="root"></main>

const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
let activeDist='all';
let whoTeuy=false, whoOum=false;
function setDist(btn){
  document.querySelectorAll('[data-dist]').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  activeDist=btn.dataset.dist;
  render();
}
function toggleWho(btn){
  btn.classList.toggle('active');
  whoTeuy=!!document.querySelector('[data-who="teuy"].active');
  whoOum=!!document.querySelector('[data-who="oum"].active');
  render();
}
function badge(d){
  if(!d)return'<div class="badge bun"><span class="b-top">dist</span><span class="b-main">?</span></div>';
  const c=d==='5k'?'b5':d==='10k'?'b10':d==='21.1k'?'b21':'b42';
  const top=d==='21.1k'?'HALF':d==='42k'?'FULL':'RUN';
  const main=d==='21.1k'?'21.1':d==='42k'?'42K':d.toUpperCase();
  return`<div class="badge ${c}"><span class="b-top">${top}</span><span class="b-main">${main}</span></div>`;
}
function avs(ps){
  return ps.map(p=>{
    const c=p==='Oum'?'av-oum':'av-me';
    const label=p==='Oum'?'อุ้ม':'เต้ย';
    return`<div class="av ${c}" title="${label}">${label}</div>`;
  }).join('');
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function stripLocParens(s){
  let changed=true;
  while(changed){
    changed=false;
    s=s.replace(/\(([^()]*)\)/g,(full,inner)=>{
      const t=inner.trim();
      const outside=s.replace(full,'');
      const isAddr=/^\d/.test(t)||/\b(rd|road|soi|street|ave|lane|ถนน)\b/i.test(t);
      const head=t.toLowerCase().slice(0,Math.min(12,t.length));
      const isDup=t.length>8&&head&&outside.toLowerCase().includes(head);
      const isLong=t.length>20;
      if(isAddr||isDup||isLong){changed=true;return '';}
      if(t.length<=10) return full;
      changed=true;return '';
    });
    s=s.replace(/\s{2,}/g,' ').replace(/\s+,/g,',').replace(/,\s*$/,'').trim();
  }
  return s;
}
function shortLoc(full){
  if(!full) return '';
  let s=stripLocParens(String(full).trim());
  if(s.length<=40) return s;
  const parts=s.split(',').map(p=>p.trim()).filter(Boolean);
  const first=parts[0]||s;
  const vm=first.match(/^(.{3,40}?)\s+\d{1,5}(?:\/\d+)?\b/);
  if(vm) return vm[1];
  const ac=first.match(/\(([A-Za-z0-9]{2,8})\)\s*$/);
  if(ac&&first.length>20){
    let city='';
    if(parts.length>=3) city=parts[parts.length-2].replace(/\s+\d{4,5}$/,'').trim();
    else if(parts.length===2) city=parts[1].replace(/\s+\d{4,5}$/,'').trim();
    return city?ac[1]+', '+city:ac[1];
  }
  if(first.length<=44&&parts.length>=2) return first;
  if(parts.length>=2){
    let city=parts[parts.length-2].replace(/\s+\d{4,5}$/,'').trim();
    let country=parts[parts.length-1].replace(/\s+\d{4,5}$/,'').trim();
    if(/\b(district|mueang|amphoe)\b/i.test(city)&&parts.length>=3)
      city=parts[parts.length-3].replace(/\s+\d{4,5}$/,'').trim();
    if(city.toLowerCase()===country.toLowerCase()) return city;
    return city+', '+country;
  }
  return s.length>40?s.slice(0,37)+'…':s;
}
function mapsHref(loc){
  return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(loc);
}
function card(ev){
  const d=new Date(ev.date+'T00:00:00');
  const loc=ev.location?`<a class="mi maps" href="${mapsHref(ev.location).replace(/&/g,'&amp;')}" target="_blank" rel="noopener noreferrer" title="${esc(ev.location)}">📍 ${esc(shortLoc(ev.location))}</a>`:'';
  const time=ev.time&&ev.time!=='00:00'?`<span class="mi">🕐 ${ev.time}</span>`:'';
  return`<div class="card${ev.isPast?' past':''}">
    <div class="body"><div class="title">${esc(ev.title)}</div><div class="meta">${time}${loc}</div></div>
    <div class="date"><div class="dow">${DOW[d.getDay()]}</div><div class="day">${d.getDate()}</div><div class="mon">${MON[d.getMonth()]} ${d.getFullYear()}</div></div>
    <div class="side">${badge(ev.distance)}<div class="avs">${avs(ev.participants)}</div></div>
  </div>`;
}
function rel(iso){
  const m=Math.round((Date.now()-new Date(iso))/60000);
  if(m<2)return'just now';if(m<60)return m+'m ago';
  const h=Math.round(m/60);if(h<24)return h+'h ago';
  return Math.round(h/24)+'d ago';
}
function filterEvents(events){
  const q=(document.getElementById('search').value||'').toLowerCase().trim();
  return events.filter(ev=>{
    if(activeDist!=='all' && ev.distance!==activeDist) return false;
    const hasMe=ev.participants.includes('Me');
    const hasOum=ev.participants.includes('Oum');
    if(whoTeuy && whoOum){
      if(!(hasMe && hasOum)) return false;
    } else if(whoTeuy){
      if(!hasMe) return false;
    } else if(whoOum){
      if(!hasOum) return false;
    }
    if(q){
      const hay=(ev.title+' '+ev.location).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}
function section(title, events, collapsePast){
  if(!events.length) return`<p class="sec">${title}<span class="count">0</span></p><div class="empty"><div class="empty-ico">🏃</div><p>No events</p><p class="empty-hint">ลองเปลี่ยนตัวกรองหรือคำค้นหา</p></div>`;
  let h=`<p class="sec">${title}<span class="count">${events.length}</span></p>`;
  if(!collapsePast){ h+=events.map(card).join(''); }
  else {
    const vis=events.slice(0,5), hid=events.slice(5);
    h+=vis.map(card).join('');
    if(hid.length){
      const id='more-'+Math.random().toString(36).slice(2);
      h+=`<div id="${id}" style="display:none">${hid.map(card).join('')}</div>
          <button class="more-btn" onclick="var m=document.getElementById('${id}');var show=m.style.display==='none';m.style.display=show?'block':'none';this.textContent=show?'Hide older events':'Show ${hid.length} more past events';">Show ${hid.length} more past events</button>`;
    }
  }
  return h;
}

function startOfDay(d){
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}
function daysUntil(ev){
  const today=startOfDay(new Date());
  const race=startOfDay(new Date(ev.date+'T00:00:00'));
  return Math.round((race-today)/86400000);
}
function countdownLabel(days){
  if(days<=0) return {text:'วันนี้', cls:'today'};
  if(days===1) return {text:'พรุ่งนี้', cls:''};
  return {text:'อีก '+days+' วัน', cls:''};
}
function soonestUpcoming(list){
  const up=list.filter(e=>!e.isPast).slice().sort((a,b)=>{
    if(a.date!==b.date) return a.date<b.date?-1:1;
    const ta=a.time||'99:99', tb=b.time||'99:99';
    return ta<tb?-1:ta>tb?1:0;
  });
  return up[0]||null;
}
function pickNextRace(filtered, all){
  const fromFilter=soonestUpcoming(filtered);
  if(fromFilter) return {ev:fromFilter, fallback:false};
  const fromAll=soonestUpcoming(all);
  if(fromAll) return {ev:fromAll, fallback:true};
  return null;
}
function heroCard(ev, fallback){
  const d=new Date(ev.date+'T00:00:00');
  const days=daysUntil(ev);
  const cd=countdownLabel(days);
  const loc=ev.location?`<a class="mi maps" href="${mapsHref(ev.location).replace(/&/g,'&amp;')}" target="_blank" rel="noopener noreferrer" title="${esc(ev.location)}">📍 ${esc(shortLoc(ev.location))}</a>`:'';
  const time=ev.time&&ev.time!=='00:00'?`<span class="mi">🕐 ${ev.time}</span>`:'';
  const fb=fallback?'<div class="hero-fallback">Showing next overall · filters hide upcoming</div>':'';
  return`<article class="hero" aria-label="Next race">
    <div class="hero-inner">
      <div class="hero-main">
        <div class="hero-kicker">Next Race</div>
        <div class="hero-count ${cd.cls}">${esc(cd.text)}</div>
        <div class="hero-title">${esc(ev.title)}</div>
        <div class="hero-meta">${time}${loc}</div>
        ${fb}
      </div>
      <div class="hero-right">
        ${badge(ev.distance)}
        <div class="hero-date"><div class="dow">${DOW[d.getDay()]}</div><div class="day">${d.getDate()}</div><div class="mon">${MON[d.getMonth()]} ${d.getFullYear()}</div></div>
        <div class="avs">${avs(ev.participants)}</div>
      </div>
    </div>
  </article>`;
}
function render(){
  const {updated,events}=EVENTS_DATA;
  const filtered=filterEvents(events);
  const up=filtered.filter(e=>!e.isPast);
  const past=filtered.filter(e=>e.isPast).reverse();
  const next=pickNextRace(filtered, events);
  const hero=next?heroCard(next.ev, next.fallback):'';
  let list=section('Upcoming', up, false)+section('Past', past, true);
  if(hero) list=list.replace('class="sec"', 'class="sec after-hero"', 1);
  document.getElementById('root').innerHTML=hero+list;
  document.getElementById('sub').textContent=`${events.length} events · updated ${rel(updated)}`;
  document.getElementById('ft').textContent='Synced from Google Calendar';
}
render();
</script>
