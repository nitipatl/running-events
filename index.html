<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Running Events</title>
  <style>
    :root {
      --bg:        #0f1117;
      --surface:   #1a1d27;
      --border:    #2a2d3a;
      --text:      #e8eaf0;
      --muted:     #6b7280;
      --accent:    #f97316;
      --10k:       #22c55e;
      --21k:       #f59e0b;
      --42k:       #ef4444;
      --unknown:   #6b7280;
      --radius:    12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
    }

    /* ── header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 24px 20px;
      text-align: center;
    }

    header .icon { font-size: 2rem; margin-bottom: 6px; }

    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    header p.subtitle {
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 4px;
    }

    /* ── layout ── */
    main {
      max-width: 680px;
      margin: 0 auto;
      padding: 28px 16px 60px;
    }

    /* ── section heading ── */
    .section-title {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 32px 0 12px;
    }

    .section-title:first-child { margin-top: 0; }

    /* ── event card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      margin-bottom: 10px;
      display: grid;
      grid-template-columns: 56px 1fr auto;
      gap: 0 14px;
      align-items: start;
      transition: border-color 0.15s;
    }

    .card:hover { border-color: #3a3d4a; }

    .card.past { opacity: 0.55; }

    /* date column */
    .card-date {
      text-align: center;
      padding-top: 2px;
    }

    .card-date .day {
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1;
      color: var(--accent);
    }

    .card.past .card-date .day { color: var(--muted); }

    .card-date .month {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-top: 2px;
    }

    /* body column */
    .card-body { min-width: 0; }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 7px;
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .meta-item svg { flex-shrink: 0; opacity: 0.7; }

    /* distance badge */
    .badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 99px;
      letter-spacing: 0.04em;
    }

    .badge-10k  { background: #14532d33; color: var(--10k);  border: 1px solid #14532d88; }
    .badge-21k  { background: #78350f33; color: var(--21k);  border: 1px solid #78350f88; }
    .badge-42k  { background: #7f1d1d33; color: var(--42k);  border: 1px solid #7f1d1d88; }
    .badge-unk  { background: #37415133; color: var(--muted); border: 1px solid #37415188; }

    /* participants */
    .avatars {
      display: flex;
      gap: 4px;
      align-items: center;
      padding-top: 3px;
    }

    .avatar {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      font-size: 0.65rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--bg);
    }

    .avatar-me  { background: #1e40af; color: #93c5fd; }
    .avatar-oum { background: #6d28d9; color: #c4b5fd; }

    /* ── empty / error ── */
    .empty {
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      padding: 40px 0;
    }

    /* ── updated footer ── */
    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.75rem;
      padding: 24px 16px;
    }

    /* ── loading spinner ── */
    .loader {
      text-align: center;
      padding: 60px 0;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── past toggle ── */
    .toggle-past {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
      margin: 12px 0 0;
    }

    .toggle-past input { accent-color: var(--accent); }

    @media (max-width: 480px) {
      .card { grid-template-columns: 48px 1fr auto; }
    }
  </style>
</head>
<body>

<header>
  <div class="icon">🏃</div>
  <h1>Running Events</h1>
  <p class="subtitle" id="subtitle">Loading…</p>
</header>

<main>
  <div id="root">
    <div class="loader">
      <div class="spinner"></div>
      <p style="color:var(--muted);font-size:.85rem">Fetching events…</p>
    </div>
  </div>
</main>

<footer id="footer"></footer>

<script>
const EVENTS_URL = './events.json';

const MONTH = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function distanceBadge(d) {
  if (!d) return `<span class="badge badge-unk">?</span>`;
  const cls = d === '10k' ? 'badge-10k' : d === '21.1k' ? 'badge-21k' : 'badge-42k';
  return `<span class="badge ${cls}">${d}</span>`;
}

function icon(path, size = 14) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none"
    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="${path}"/>
  </svg>`;
}

const PIN_PATH  = 'M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z';
const TIME_PATH = 'M12 2a10 10 0 1 0 0 20A10 10 0 0 0 12 2zm0 5v5l4 2';

function avatars(participants) {
  return participants.map(p => {
    const cls = p === 'Oum' ? 'avatar-oum' : 'avatar-me';
    const label = p === 'Oum' ? 'OUM' : 'ME';
    return `<div class="avatar ${cls}" title="${p}">${label}</div>`;
  }).join('');
}

function renderCard(ev) {
  const d    = new Date(ev.date + 'T00:00:00');
  const day  = d.getDate();
  const mon  = MONTH[d.getMonth()];
  const year = d.getFullYear();

  const timePart = ev.time && ev.time !== '00:00'
    ? `<span class="meta-item">${icon(TIME_PATH)} ${ev.time}</span>`
    : '';

  const locPart = ev.location
    ? `<span class="meta-item">${icon(PIN_PATH)} ${escHtml(ev.location)}</span>`
    : '';

  return `
    <div class="card ${ev.isPast ? 'past' : ''}">
      <div class="card-date">
        <div class="day">${day}</div>
        <div class="month">${mon} ${year}</div>
      </div>
      <div class="card-body">
        <div class="card-title">${escHtml(ev.title)}</div>
        <div class="card-meta">
          ${distanceBadge(ev.distance)}
          ${timePart}
          ${locPart}
        </div>
      </div>
      <div class="avatars">${avatars(ev.participants)}</div>
    </div>`;
}

function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function relativeTime(iso) {
  const diff = Date.now() - new Date(iso).getTime();
  const mins = Math.round(diff / 60000);
  if (mins < 2)  return 'just now';
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.round(mins / 60);
  if (hrs < 24)  return `${hrs}h ago`;
  return `${Math.round(hrs/24)}d ago`;
}

async function load() {
  try {
    const res  = await fetch(EVENTS_URL + '?t=' + Date.now());
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();

    const upcoming = data.events.filter(e => !e.isPast);
    const past     = data.events.filter(e =>  e.isPast).reverse(); // newest first

    document.getElementById('subtitle').textContent =
      `${upcoming.length} upcoming · ${past.length} past`;

    let html = '';

    if (upcoming.length === 0) {
      html += `<p class="section-title">Upcoming</p>
               <div class="empty">No upcoming events</div>`;
    } else {
      html += `<p class="section-title">Upcoming — ${upcoming.length} events</p>`;
      html += upcoming.map(renderCard).join('');
    }

    html += `<p class="section-title" style="margin-top:36px">
               Past — ${past.length} events
             </p>`;

    if (past.length === 0) {
      html += `<div class="empty">No past events</div>`;
    } else {
      // show first 5, rest behind toggle
      const visible = past.slice(0, 5);
      const hidden  = past.slice(5);

      html += visible.map(renderCard).join('');

      if (hidden.length > 0) {
        html += `
          <label class="toggle-past">
            <input type="checkbox" id="show-more" onchange="toggleMore(this)">
            Show ${hidden.length} more past events
          </label>
          <div id="more-past" style="display:none">
            ${hidden.map(renderCard).join('')}
          </div>`;
      }
    }

    document.getElementById('root').innerHTML = html;
    document.getElementById('footer').textContent =
      `Last updated ${relativeTime(data.updated)} · refreshes every 30 min`;

  } catch (err) {
    document.getElementById('root').innerHTML = `
      <div class="empty">
        ⚠️ Could not load events.<br>
        <small style="font-size:.75rem">${err.message}</small>
      </div>`;
    document.getElementById('subtitle').textContent = 'Error loading';
  }
}

function toggleMore(cb) {
  document.getElementById('more-past').style.display = cb.checked ? 'block' : 'none';
  cb.parentElement.childNodes[1].textContent = cb.checked
    ? 'Hide older events'
    : `Show ${document.getElementById('more-past').children.length} more past events`;
}

load();
</script>
</body>
</html>
