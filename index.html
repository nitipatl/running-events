<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Running Events</title>
<style>
:root{--bg:#0f1117;--s:#1a1d27;--b:#2a2d3a;--t:#e8eaf0;--m:#6b7280;--a:#f97316;--r:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}
header{background:var(--s);border-bottom:1px solid var(--b);padding:20px;text-align:center}
header h1{font-size:1.5rem;font-weight:700}
header p{color:var(--m);font-size:.82rem;margin-top:4px}
main{max-width:660px;margin:0 auto;padding:24px 14px 60px}
.sec{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--m);margin:28px 0 10px}
.sec:first-child{margin-top:0}
.card{background:var(--s);border:1px solid var(--b);border-radius:var(--r);padding:14px 16px;margin-bottom:8px;display:grid;grid-template-columns:52px 1fr auto;gap:0 12px;align-items:start}
.card.past{opacity:.5}
.day{font-size:1.4rem;font-weight:700;color:var(--a);line-height:1;text-align:center}
.card.past .day{color:var(--m)}
.mon{font-size:.65rem;text-transform:uppercase;letter-spacing:.06em;color:var(--m);text-align:center;margin-top:2px}
.title{font-size:.92rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;align-items:center}
.badge{font-size:.68rem;font-weight:700;padding:2px 7px;border-radius:99px}
.b10{background:#14532d22;color:#22c55e;border:1px solid #14532d66}
.b21{background:#78350f22;color:#f59e0b;border:1px solid #78350f66}
.b42{background:#7f1d1d22;color:#ef4444;border:1px solid #7f1d1d66}
.bun{background:#37415122;color:var(--m);border:1px solid #37415166}
.mi{font-size:.75rem;color:var(--m)}
.avs{display:flex;gap:3px;padding-top:2px}
.av{width:24px;height:24px;border-radius:50%;font-size:.62rem;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
.av-me{background:#1e40af;color:#93c5fd}
.av-oum{background:#6d28d9;color:#c4b5fd}
.empty{text-align:center;color:var(--m);font-size:.88rem;padding:32px 0}
.more-btn{background:none;border:1px solid var(--b);color:var(--m);font-size:.78rem;padding:8px 16px;border-radius:var(--r);cursor:pointer;margin-top:4px;width:100%}
.more-btn:hover{border-color:#3a3d4a}
footer{text-align:center;color:var(--m);font-size:.72rem;padding:20px}
</style>
</head>
<body>
<header>
  <div style="font-size:1.8rem;margin-bottom:4px">🏃</div>
  <h1>Running Events</h1>
  <p id="sub"></p>
</header>
<main id="root"></main>
<footer id="ft"></footer>
<script>
// <!--DATA_START-->
const EVENTS_DATA={"updated":"1970-01-01T00:00:00+00:00","events":[]};
// <!--DATA_END-->

const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function badge(d){
  if(!d)return'<span class="badge bun">?</span>';
  const c=d==='10k'?'b10':d==='21.1k'?'b21':'b42';
  return`<span class="badge ${c}">${d}</span>`;
}
function avs(ps){
  return ps.map(p=>{
    const c=p==='Oum'?'av-oum':'av-me';
    return`<div class="av ${c}" title="${p}">${p==='Oum'?'OUM':'ME'}</div>`;
  }).join('');
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function card(ev){
  const d=new Date(ev.date+'T00:00:00');
  const loc=ev.location?`<span class="mi">📍 ${esc(ev.location)}</span>`:'';
  const time=ev.time&&ev.time!=='00:00'?`<span class="mi">🕐 ${ev.time}</span>`:'';
  return`<div class="card${ev.isPast?' past':''}">
    <div><div class="day">${d.getDate()}</div><div class="mon">${MON[d.getMonth()]} ${d.getFullYear()}</div></div>
    <div><div class="title">${esc(ev.title)}</div><div class="meta">${badge(ev.distance)}${time}${loc}</div></div>
    <div class="avs">${avs(ev.participants)}</div>
  </div>`;
}
function rel(iso){
  const m=Math.round((Date.now()-new Date(iso))/60000);
  if(m<2)return'just now';if(m<60)return m+'m ago';
  const h=Math.round(m/60);if(h<24)return h+'h ago';
  return Math.round(h/24)+'d ago';
}

(function render(){
  const {updated,events}=EVENTS_DATA;
  const up=events.filter(e=>!e.isPast);
  const past=events.filter(e=>e.isPast).reverse();
  document.getElementById('sub').textContent=`${up.length} upcoming · ${past.length} past`;

  let h=`<p class="sec">Upcoming — ${up.length} events</p>`;
  h+=up.length?up.map(card).join(''):'<div class="empty">No upcoming events</div>';

  h+=`<p class="sec" style="margin-top:32px">Past — ${past.length} events</p>`;
  if(!past.length){h+='<div class="empty">No past events</div>';}
  else{
    const vis=past.slice(0,5),hid=past.slice(5);
    h+=vis.map(card).join('');
    if(hid.length){
      const n=hid.length;
      h+=`<div id="more" style="display:none">${hid.map(card).join('')}</div>
          <button class="more-btn" id="mbtn" onclick="
            var m=document.getElementById('more');
            var show=m.style.display==='none';
            m.style.display=show?'block':'none';
            this.textContent=show?'Hide older events':'Show ${hid.length} more past events';
          ">Show ${hid.length} more past events</button>`;
    }
  }

  document.getElementById('root').innerHTML=h;
  document.getElementById('ft').textContent=`Updated ${rel(updated)} · refreshes every 30 min`;
})();
</script>
</body>
</html>
